server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow clipboard API and other browser permissions
    add_header Permissions-Policy "clipboard-read=*, clipboard-write=*";

    # Serve static assets with caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Permissions-Policy "clipboard-read=*, clipboard-write=*";
    }

    # Never cache index.html so browsers always fetch the latest asset hashes after a rebuild
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Permissions-Policy "clipboard-read=*, clipboard-write=*";
        try_files $uri =404;
    }

    # All other routes → index.html (React client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
